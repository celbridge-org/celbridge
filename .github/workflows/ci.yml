name: CI

on:
  push:
    branches: ['**']  # Run on all branches
  pull_request:
    branches: [main]  # Run on PRs targeting main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest  # Linux runner - faster and cross-platform compatible
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Central Package Management holds every version in Directory.Packages.props, so that file plus
      # the SDK band is what decides the restore graph.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Source/Directory.Packages.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Source/Tests/Celbridge.Tests.csproj

      - name: Build tests
        run: dotnet build Source/Tests/Celbridge.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Source/Tests/Celbridge.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()  # Run even if tests fail
        with:
          name: Unit Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: true

  js-test:
    name: Run JS Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Source/package-lock.json

      - name: Install dependencies
        working-directory: ./Source
        run: npm install

      # Checks the lockfile against the npm advisory database, so this can start failing
      # without a code change when a new advisory is published against a pinned version.
      - name: Audit dependencies
        working-directory: ./Source
        run: npm audit --audit-level=moderate

      - name: Run JS tests
        working-directory: ./Source
        run: npm test

      # Runs even when the tests fail, so one run reports both.
      - name: Run JS lint
        if: always()
        working-directory: ./Source
        run: npm run lint

  python-test:
    name: Run Python Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: Source/Workspace/Celbridge.Python/packages/celbridge/pyproject.toml

      - name: Install packages with dev dependencies
        working-directory: ./Source/Workspace/Celbridge.Python
        run: pip install -e "packages/celbridge[dev]"

      - name: Run Python tests
        working-directory: ./Source/Workspace/Celbridge.Python
        run: python run_tests.py

      # Runs even when the tests fail, so one run reports both.
      - name: Run Python lint
        if: always()
        working-directory: ./Source/Workspace/Celbridge.Python
        run: ruff check packages/celbridge
