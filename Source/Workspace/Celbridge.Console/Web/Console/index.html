<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Console</title>

    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="/assets/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/celbridge-client/celbridge.css">
    <link rel="stylesheet" href="lib/xterm.css">
    <link rel="stylesheet" href="console.css">

    <script src="lib/xterm.js"></script>
    <script src="lib/addon-fit.js"></script>
    <script src="lib/addon-clipboard.js"></script>
    <script src="lib/addon-unicode11.js"></script>
    <script src="lib/addon-web-links.js"></script>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <div id="shortcut-toolbar" class="hidden"></div>
            <button id="settings-toggle" class="cel-icon-button" type="button" data-loc-key="Console_Settings_Title" data-loc-attr="title,aria-label">
                <i class="bi bi-gear"></i>
                <span id="pip" class="pip hidden"></span>
            </button>
        </div>

        <div id="content">
            <div id="terminal-view">
                <div id="terminal"></div>
                <div id="session-starting" class="overlay">
                    <div class="overlay-message" data-loc-key="Console_Opening"></div>
                </div>
                <div id="session-failed" class="overlay hidden">
                    <div class="overlay-card">
                        <div id="session-failed-message" class="overlay-message"></div>
                        <button id="reopen-terminal" type="button" class="cel-accent" data-loc-key="Console_Reopen" data-loc-title="Console_Reopen_Tooltip"></button>
                    </div>
                </div>
            </div>

            <div id="splitter" class="cel-splitter hidden"></div>

            <div id="settings-view" class="hidden">
                <div class="settings-header">
                    <h1 data-loc-key="Console_Settings_Heading"></h1>
                    <p class="settings-subtitle" data-loc-key="Console_Settings_Subtitle"></p>
                    <div id="config-error" class="config-error hidden"></div>
                </div>
                <div id="settings-scroll" class="settings-scroll">

                <details class="cel-expander">
                    <summary data-loc-key="Console_Group_Session"></summary>
                    <div class="cel-expander-body">
                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_Type"></span>
                            <select id="session-type">
                                <option value="shell" data-loc-key="Console_Type_Shell"></option>
                                <option value="python" data-loc-key="Console_Type_Python"></option>
                            </select>
                        </label>

                        <label class="field" id="executable-field">
                            <span class="field-label" data-loc-key="Console_Field_Executable"></span>
                            <input id="executable" type="text" spellcheck="false" data-loc-key="Console_Placeholder_Executable" data-loc-attr="placeholder">
                            <span class="field-hint" data-loc-key="Console_Hint_Executable"></span>
                        </label>

                        <label class="field hidden" id="python-version-field">
                            <span class="field-label" data-loc-key="Console_Field_PythonVersion"></span>
                            <input id="python-version" type="text" spellcheck="false" data-loc-key="Console_Placeholder_PythonVersion" data-loc-attr="placeholder">
                            <span class="field-hint" data-loc-key="Console_Hint_PythonVersion"></span>
                        </label>

                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_Arguments"></span>
                            <textarea id="arguments" rows="2" spellcheck="false" data-loc-key="Console_Placeholder_Arguments" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_Arguments"></span>
                        </label>

                        <label class="field hidden" id="dependencies-field">
                            <span class="field-label" data-loc-key="Console_Field_Dependencies"></span>
                            <textarea id="dependencies" rows="3" spellcheck="false" data-loc-key="Console_Placeholder_Dependencies" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_Dependencies"></span>
                        </label>

                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_WorkingDirectory"></span>
                            <input id="working-directory" type="text" spellcheck="false" data-loc-key="Console_Placeholder_WorkingDirectory" data-loc-attr="placeholder">
                            <span class="field-hint" data-loc-key="Console_Hint_WorkingDirectory"></span>
                        </label>

                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_StartupScript"></span>
                            <textarea id="startup-script" rows="3" spellcheck="false" data-loc-key="Console_Placeholder_StartupScript" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_StartupScript"></span>
                        </label>
                    </div>
                </details>

                <details class="cel-expander">
                    <summary data-loc-key="Console_Group_Environment"></summary>
                    <div class="cel-expander-body">
                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_Environment"></span>
                            <textarea id="environment" rows="4" spellcheck="false" data-loc-key="Console_Placeholder_Environment" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_Environment"></span>
                        </label>
                    </div>
                </details>

                <details class="cel-expander">
                    <summary data-loc-key="Console_Group_Runners"></summary>
                    <div class="cel-expander-body">
                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_Runners"></span>
                            <textarea id="runners" rows="3" spellcheck="false" data-loc-key="Console_Placeholder_Runners" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_Runners"></span>
                        </label>
                    </div>
                </details>

                <details class="cel-expander">
                    <summary data-loc-key="Console_Group_Shortcuts"></summary>
                    <div class="cel-expander-body">
                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_Shortcuts"></span>
                            <textarea id="shortcuts" rows="3" spellcheck="false" data-loc-key="Console_Placeholder_Shortcuts" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_Shortcuts"></span>
                        </label>
                    </div>
                </details>

                </div>
                <div class="cel-panel-footer">
                    <p data-loc-key="Console_ReopenCaption"></p>
                    <button id="reopen-settings" type="button" data-loc-key="Console_ReopenSession" data-loc-title="Console_Reopen_Tooltip"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="terminal-themes.js"></script>
    <script type="module" src="console.js"></script>
</body>
</html>
