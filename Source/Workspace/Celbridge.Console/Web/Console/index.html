<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Console</title>

    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="/assets/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/celbridge-client/celbridge.css">
    <link rel="stylesheet" href="lib/xterm.css">
    <link rel="stylesheet" href="console.css">

    <script src="lib/xterm.js"></script>
    <script src="lib/addon-fit.js"></script>
    <script src="lib/addon-clipboard.js"></script>
    <script src="lib/addon-unicode11.js"></script>
    <script src="lib/addon-web-links.js"></script>
</head>
<body>
    <div id="app">
        <div id="content">
            <div id="terminal-view">
                <div id="terminal"></div>
                <div id="session-starting" class="overlay">
                    <div class="starting-message" data-loc-key="Console_Opening"></div>
                </div>
                <div id="session-failed" class="overlay hidden">
                    <div class="overlay-card">
                        <div id="session-failed-message" class="overlay-message"></div>
                        <button id="reopen-terminal" type="button" class="cel-accent" data-loc-key="Console_Reopen" data-loc-title="Console_Reopen_Tooltip"></button>
                    </div>
                </div>
            </div>

            <div id="splitter" class="cel-splitter hidden"></div>

            <div id="settings-view" class="hidden">
                <div class="settings-title" data-loc-key="Console_Settings_Heading"></div>

                <div class="cel-nav-tabs">
                    <div id="settings-tabs" class="cel-nav-tab-strip" role="tablist">
                        <button class="cel-nav-tab" type="button" role="tab" data-section="session" aria-selected="true"
                                data-loc-key="Console_Group_Session" data-loc-attr="title,aria-label">
                            <span class="cel-nav-tab-icon"><i class="bi bi-terminal"></i></span>
                        </button>
                        <button class="cel-nav-tab" type="button" role="tab" data-section="automation"
                                data-loc-key="Console_Group_Automation" data-loc-attr="title,aria-label">
                            <span class="cel-nav-tab-icon"><i class="bi bi-lightning-charge"></i></span>
                        </button>
                    </div>

                    <!-- One header per section, all present with the active one shown, mirroring how the
                         native settings panel toggles between its section views. -->
                    <div class="cel-section-header" data-section="session">
                        <h1 data-loc-key="Console_Group_Session"></h1>
                        <p data-loc-key="Console_Desc_Session"></p>
                    </div>
                    <div class="cel-section-header hidden" data-section="automation">
                        <h1 data-loc-key="Console_Group_Automation"></h1>
                        <p data-loc-key="Console_Desc_Automation"></p>
                    </div>

                    <div id="config-error" class="config-error hidden"></div>
                </div>

                <div id="settings-scroll" class="settings-scroll">

                    <section class="settings-section" data-section="session">
                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_Type"></span>
                            <select id="session-type">
                                <option value="shell" data-loc-key="Console_Type_Shell"></option>
                                <option value="python" data-loc-key="Console_Type_Python"></option>
                            </select>
                        </label>

                        <label class="field" id="executable-field">
                            <span class="field-label" data-loc-key="Console_Field_Executable"></span>
                            <input id="executable" type="text" spellcheck="false" data-loc-key="Console_Placeholder_Executable" data-loc-attr="placeholder">
                            <span class="field-hint" data-loc-key="Console_Hint_Executable"></span>
                        </label>

                        <label class="field hidden" id="python-version-field">
                            <span class="field-label" data-loc-key="Console_Field_PythonVersion"></span>
                            <input id="python-version" type="text" spellcheck="false" data-loc-key="Console_Placeholder_PythonVersion" data-loc-attr="placeholder">
                            <span class="field-hint" data-loc-key="Console_Hint_PythonVersion"></span>
                        </label>

                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_Arguments"></span>
                            <textarea id="arguments" rows="2" spellcheck="false" data-loc-key="Console_Placeholder_Arguments" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_Arguments"></span>
                        </label>

                        <label class="field hidden" id="dependencies-field">
                            <span class="field-label" data-loc-key="Console_Field_Dependencies"></span>
                            <textarea id="dependencies" rows="3" spellcheck="false" data-loc-key="Console_Placeholder_Dependencies" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_Dependencies"></span>
                        </label>

                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_WorkingDirectory"></span>
                            <input id="working-directory" type="text" spellcheck="false" data-loc-key="Console_Placeholder_WorkingDirectory" data-loc-attr="placeholder">
                            <span class="field-hint" data-loc-key="Console_Hint_WorkingDirectory"></span>
                        </label>

                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_Environment"></span>
                            <textarea id="environment" rows="4" spellcheck="false" data-loc-key="Console_Placeholder_Environment" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_Environment"></span>
                        </label>

                        <label class="field">
                            <span class="field-label" data-loc-key="Console_Field_StartupScript"></span>
                            <textarea id="startup-script" rows="3" spellcheck="false" data-loc-key="Console_Placeholder_StartupScript" data-loc-attr="placeholder"></textarea>
                            <span class="field-hint" data-loc-key="Console_Hint_StartupScript"></span>
                        </label>
                    </section>

                    <!-- Every way of getting a command into this console: keyed on a file extension, on a
                         file changing, or on a button press. Each entry is a card, so the list is edited
                         through the cards rather than through a delimited text format. -->
                    <section class="settings-section hidden" data-section="automation">

                        <div class="card-list-group">
                            <h2 class="card-list-title" data-loc-key="Console_Field_Runners"></h2>
                            <p class="card-list-hint" data-loc-key="Console_Hint_Runners"></p>
                            <!-- Built-in runners sit below the console's own because the whole section is one
                                 precedence chain read top to bottom: FindRunner takes the first match, so a
                                 card above shadows one below it for the extensions they share. -->
                            <div id="runner-cards" class="cel-card-list"></div>
                            <div id="runner-built-in" class="cel-card-list built-in-list"></div>
                            <p id="runner-empty" class="card-list-empty" data-loc-key="Console_Empty_Runners"></p>
                            <button id="add-runner" type="button" class="add-card-button">
                                <i class="bi bi-plus-lg"></i><span data-loc-key="Console_Add_Runner"></span>
                            </button>
                        </div>

                        <div class="card-list-group">
                            <h2 class="card-list-title" data-loc-key="Console_Field_Triggers"></h2>
                            <p class="card-list-hint" data-loc-key="Console_Hint_Triggers"></p>
                            <div id="trigger-cards" class="cel-card-list"></div>
                            <p id="trigger-empty" class="card-list-empty" data-loc-key="Console_Empty_Triggers"></p>
                            <button id="add-trigger" type="button" class="add-card-button">
                                <i class="bi bi-plus-lg"></i><span data-loc-key="Console_Add_Trigger"></span>
                            </button>
                        </div>

                        <div class="card-list-group">
                            <h2 class="card-list-title" data-loc-key="Console_Field_Shortcuts"></h2>
                            <p class="card-list-hint" data-loc-key="Console_Hint_Shortcuts"></p>
                            <div id="shortcut-cards" class="cel-card-list"></div>
                            <p id="shortcut-empty" class="card-list-empty" data-loc-key="Console_Empty_Shortcuts"></p>
                            <button id="add-shortcut" type="button" class="add-card-button">
                                <i class="bi bi-plus-lg"></i><span data-loc-key="Console_Add_Shortcut"></span>
                            </button>
                        </div>

                    </section>

                </div>
                <div class="cel-panel-footer">
                    <p data-loc-key="Console_ReopenCaption"></p>
                    <button id="reopen-settings" type="button" data-loc-key="Console_ReopenSession" data-loc-title="Console_Reopen_Tooltip"></button>
                </div>
            </div>
        </div>

        <!-- Inspector rail: the settings toggle sits above the shortcut buttons, so its position stays fixed
             as the user adds and removes shortcuts from the panel that button opens. -->
        <div class="cel-rail cel-rail-right">
            <button id="settings-toggle" class="cel-rail-button" type="button" data-loc-key="Console_Settings_Title" data-loc-attr="title,aria-label">
                <i class="bi bi-sliders"></i>
                <span id="pip" class="cel-rail-pip hidden"></span>
            </button>
            <div id="shortcut-separator" class="cel-rail-separator hidden"></div>
            <div id="shortcut-rail"></div>
        </div>
    </div>

    <!-- Card templates for the Automation lists, cloned per entry. Template content sits outside the document
         tree, so a cloned card is localized explicitly rather than by the host's startup pass. -->
    <template id="runner-card-template">
        <details class="cel-expander">
            <summary>
                <span class="cel-card-grip" data-loc-key="Console_Card_Reorder" data-loc-attr="title,aria-label">
                    <i class="bi bi-grip-vertical"></i>
                </span>
                <span class="cel-card-title"></span>
                <span class="cel-card-actions">
                    <button class="cel-icon-button cel-card-delete" type="button" data-loc-key="Console_Card_Delete" data-loc-attr="title,aria-label">
                        <i class="bi bi-trash"></i>
                    </button>
                </span>
            </summary>
            <div class="cel-expander-body">
                <label class="field">
                    <span class="field-label" data-loc-key="Console_Field_RunnerExtensions"></span>
                    <input class="runner-extensions" type="text" spellcheck="false" data-loc-key="Console_Placeholder_RunnerExtensions" data-loc-attr="placeholder">
                    <span class="field-hint" data-loc-key="Console_Hint_RunnerExtensions"></span>
                </label>
                <label class="field">
                    <span class="field-label" data-loc-key="Console_Field_RunnerCommand"></span>
                    <input class="runner-command" type="text" spellcheck="false" data-loc-key="Console_Placeholder_RunnerCommand" data-loc-attr="placeholder">
                    <span class="field-hint" data-loc-key="Console_Hint_RunnerCommand"></span>
                </label>
            </div>
        </details>
    </template>

    <!-- One runner the console's session type provides. Its fields are text rather than inputs: they come from
         the type, not the file, so there is nothing to edit. The switch is the one thing that is writable,
         recording the runner's extensions under disabled_extensions. It sits outside .cel-card-actions so it
         still reads while the card is collapsed, since it shows state rather than offering an action. -->
    <template id="built-in-runner-template">
        <details class="cel-expander built-in-card">
            <summary>
                <span class="cel-card-title"></span>
                <span class="built-in-badge" data-loc-key="Console_Runner_BuiltIn"></span>
                <button class="built-in-switch" type="button" role="switch"
                        data-loc-key="Console_Runner_BuiltInEnabled" data-loc-attr="title,aria-label">
                    <span class="built-in-switch-thumb"></span>
                </button>
            </summary>
            <div class="cel-expander-body">
                <div class="field">
                    <span class="field-label" data-loc-key="Console_Field_RunnerExtensions"></span>
                    <p class="built-in-value built-in-extensions"></p>
                </div>
                <div class="field">
                    <span class="field-label" data-loc-key="Console_Field_RunnerCommand"></span>
                    <p class="built-in-value built-in-command"></p>
                </div>
            </div>
        </details>
    </template>

    <template id="trigger-card-template">
        <details class="cel-expander">
            <summary>
                <span class="cel-card-grip" data-loc-key="Console_Card_Reorder" data-loc-attr="title,aria-label">
                    <i class="bi bi-grip-vertical"></i>
                </span>
                <span class="cel-card-title"></span>
                <span class="cel-card-actions">
                    <button class="cel-icon-button cel-card-delete" type="button" data-loc-key="Console_Card_Delete" data-loc-attr="title,aria-label">
                        <i class="bi bi-trash"></i>
                    </button>
                </span>
            </summary>
            <div class="cel-expander-body">
                <label class="field">
                    <span class="field-label" data-loc-key="Console_Field_TriggerPattern"></span>
                    <input class="trigger-pattern" type="text" spellcheck="false" data-loc-key="Console_Placeholder_TriggerPattern" data-loc-attr="placeholder">
                    <span class="field-hint" data-loc-key="Console_Hint_TriggerPattern"></span>
                </label>
                <label class="field">
                    <span class="field-label" data-loc-key="Console_Field_TriggerCommand"></span>
                    <input class="trigger-command" type="text" spellcheck="false" data-loc-key="Console_Placeholder_TriggerCommand" data-loc-attr="placeholder">
                    <span class="field-hint" data-loc-key="Console_Hint_TriggerCommand"></span>
                </label>
            </div>
        </details>
    </template>

    <template id="shortcut-card-template">
        <details class="cel-expander">
            <summary>
                <span class="cel-card-grip" data-loc-key="Console_Card_Reorder" data-loc-attr="title,aria-label">
                    <i class="bi bi-grip-vertical"></i>
                </span>
                <i class="cel-card-icon bi"></i>
                <span class="cel-card-title"></span>
                <span class="cel-card-actions">
                    <button class="cel-icon-button cel-card-delete" type="button" data-loc-key="Console_Card_Delete" data-loc-attr="title,aria-label">
                        <i class="bi bi-trash"></i>
                    </button>
                </span>
            </summary>
            <div class="cel-expander-body">
                <label class="field">
                    <span class="field-label" data-loc-key="Console_Field_ShortcutLabel"></span>
                    <input class="shortcut-label" type="text" spellcheck="false" data-loc-key="Console_Placeholder_ShortcutLabel" data-loc-attr="placeholder">
                </label>
                <label class="field">
                    <span class="field-label" data-loc-key="Console_Field_ShortcutIcon"></span>
                    <input class="shortcut-icon" type="text" spellcheck="false" data-loc-key="Console_Placeholder_ShortcutIcon" data-loc-attr="placeholder">
                    <span class="field-hint" data-loc-key="Console_Hint_ShortcutIcon"></span>
                    <span class="field-warning shortcut-icon-unknown hidden" data-loc-key="Console_Warning_UnknownIcon"></span>
                </label>
                <label class="field">
                    <span class="field-label" data-loc-key="Console_Field_ShortcutText"></span>
                    <input class="shortcut-text" type="text" spellcheck="false" data-loc-key="Console_Placeholder_ShortcutText" data-loc-attr="placeholder">
                </label>
            </div>
        </details>
    </template>

    <script src="terminal-themes.js"></script>
    <script type="module" src="console.js"></script>
</body>
</html>
