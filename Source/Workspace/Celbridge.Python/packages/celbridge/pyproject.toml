[build-system]
# Pinned rather than a floor. setuptools stamps its own version into the wheel's dist-info, so an
# unpinned range builds different bytes on every machine that resolves a different release, and the
# committed wheel then shows as modified after any rebuild. Bump deliberately.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celbridge"
version = "0.1.0"
description = "Python connector for the Celbridge application"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Celbridge.org", email = "contact@celbridge.org"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
]
keywords = ["celbridge", "repl"]
dependencies = [
    "ipython>=8.0",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://celbridge.org"
Repository = "https://github.com/celbridge-org/celbridge"
Issues = "https://github.com/celbridge-org/celbridge/issues"

[project.scripts]
celbridge-py = "celbridge.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # Pinned because a ruff release can change the default rule set and turn CI red without a code
    # change. Bump deliberately and fix whatever the new version reports.
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ruff's default rule set and nothing else, mirroring the ESLint setup for JavaScript. No rules are
# disabled here. Deliberate one-off deviations are suppressed at the offending line with a noqa
# comment explaining why. The formatter is deliberately not adopted: Source/.editorconfig owns
# formatting, and adopting a second formatting authority for one language would fork that. The
# Python target version is inferred from requires-python above.
[tool.ruff]

[tool.pytest.ini_options]
testpaths = ["tests"]
