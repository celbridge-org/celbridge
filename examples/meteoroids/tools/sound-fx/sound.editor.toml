[editor]
id = "sound-document"
type = "document"
entry-point = "index.html"
binary = true
display-name = "SFX_Editor_Name"
description = "SFX_Editor_Description"

# An established type in the host's file type catalog, which supplies its icon. The manifest still has to
# name it.
[[file-types]]
extension = ".wav"
display-name = "SFX_FileType_Wav"

# One template per preset. Each is a complete Sound FX sound, regenerated by scripts/make-templates.mjs.
[[templates]]
id = "laser"
display-name = "SFX_Template_Laser"
template-file = "templates/laser.wav"

[[templates]]
id = "explosion"
display-name = "SFX_Template_Explosion"
template-file = "templates/explosion.wav"

[[templates]]
id = "coin"
display-name = "SFX_Template_Coin"
template-file = "templates/coin.wav"
default = true

[[templates]]
id = "power-up"
display-name = "SFX_Template_PowerUp"
template-file = "templates/power-up.wav"

[[templates]]
id = "hit"
display-name = "SFX_Template_Hit"
template-file = "templates/hit.wav"

[[templates]]
id = "jump"
display-name = "SFX_Template_Jump"
template-file = "templates/jump.wav"

[[templates]]
id = "blip"
display-name = "SFX_Template_Blip"
template-file = "templates/blip.wav"
