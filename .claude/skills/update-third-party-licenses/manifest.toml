# Decisions behind THIRD-PARTY-LICENSES.txt, read by generate_licenses.py.
# SKILL.md describes each table and field.

# The restore output of the application project. It lists every NuGet package the app heads use.
assets_file = "Source/Celbridge/obj/project.assets.json"

# Licenses that need no review. A package under any other license needs accept_license = true.
accepted_licenses = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
]

# NuGet package decisions. Every decision whose ids match a package applies, the earliest winning each field.

[[package]]
ids = [
    "Uno.UI.App.Mcp",
    "Uno.UI.HotDesign",
    "Uno.WinUI.DevServer",
    "Uno.WinUI.DevServer.Messaging",
]
exclude = true
reason = "Uno developer tooling. It is in the restore graph for every configuration, but Release builds leave it out."

[[package]]
ids = [
    "AtkSharp",
    "CairoSharp",
    "GdkSharp",
    "GioSharp",
    "GLibSharp",
    "GtkSharp",
    "PangoSharp",
    "WebkitGtkSharp",
]
license = "LGPL-2.0-only"
accept_license = true
reason = "No license metadata. The GtkSharp repository ships the GNU Library General Public License version 2. Uno's Linux (X11) WebView pulls these in, and they are used unmodified as separate assemblies."

[[package]]
ids = "LibVLCSharp"
accept_license = true
reason = "LGPL-2.1-or-later. Uno's Linux (X11) runtime pulls it in, and it is used unmodified as a separate assembly."

[[package]]
ids = "CommonServiceLocator"
license = "MS-PL"
accept_license = true
reason = "The metadata only links to the Microsoft Public License, which allows redistribution in binary form with the notices kept. Uno pulls it in."

[[package]]
ids = [
    "Uno.icu-macos",
    "Uno.icu-win",
]
license = "Apache-2.0 AND Unicode-3.0"
accept_license = true
source = "https://github.com/unoplatform/uno.icu"
note = "Contains ICU binaries, licensed under the Unicode License v3."
reason = "No license metadata. The uno.icu repository is Apache-2.0, and the ICU binaries it packages are under the Unicode License v3."

[[package]]
ids = [
    "Uno.Diagnostics.Eventing",
    "Uno.Wasm.WebSockets",
]
license = "Apache-2.0"
reason = "No license metadata. Both source repositories are Apache-2.0."

[[package]]
ids = "Uno.Fonts.Roboto"
license = "Apache-2.0"
note = "Includes the Roboto font."
reason = "No license metadata. The uno.fonts repository is Apache-2.0."

[[package]]
ids = [
    "Uno.Extensions.Markup.WinUI",
    "Uno.WinUI.Markup",
]
license = "LicenseRef-Not-Stated"
accept_license = true
note = "The publisher does not state a license for this package."
reason = "Uno C# Markup packages with no license metadata and no linked source repository. Celbridge calls no C# Markup APIs, but the package adds global usings for WinUI namespaces that code across the solution relies on, so the CSharpMarkup feature stays."

[[package]]
ids = "Microsoft.Web.WebView2"
accept_license = true
notices = "include"
reason = "Microsoft's BSD-style license for the WebView2 SDK, shipped in the package."

[[package]]
ids = "Microsoft.WindowsAppSDK"
accept_license = true
notices = "include"
reason = "The Microsoft Software License Terms for the Windows App SDK, shipped in the package."

[[package]]
ids = [
    "CommunityToolkit.Mvvm",
    "HarfBuzzSharp.NativeAssets.*",
    "Nerdbank.MessagePack",
    "Nerdbank.Streams",
    "SkiaSharp.NativeAssets.*",
]
notices = "include"
reason = "The notices cover third-party code built into the shipped assemblies and native libraries."

[[package]]
ids = [
    "Microsoft.Bcl.*",
    "Microsoft.Extensions.*",
    "System.*",
]
notices = "omit"
reason = "Repository-wide notices from the .NET repositories, not specific to these assemblies. The .NET Runtime component includes the runtime's notices."

[[package]]
ids = [
    "Microsoft.VisualStudio.Threading.Only",
    "Microsoft.VisualStudio.Validation",
    "StreamJsonRpc",
]
notices = "omit"
reason = "Repository-wide notices that list each project's build and test dependencies, not code in the package."

# Bundled components that no package manager reports: vendored scripts, fonts, tools and the runtime.

[[component]]
name = ".NET Runtime"
runtime_pack = "microsoft.netcore.app.runtime.win-x64"
license = "MIT"
copyright = "Copyright (c) .NET Foundation and Contributors"
source = "https://github.com/dotnet/runtime"
note = "Celbridge is published self-contained, so the .NET runtime ships with it."

[[component]]
name = "Bootstrap Icons"
version = "1.12.1"
license = "MIT"
copyright = "Copyright (c) 2019-2024 The Bootstrap Authors"
source = "https://github.com/twbs/icons"
paths = [
    "Source/Core/Celbridge.UserInterface/Assets/Fonts/BootstrapIcons",
    "Source/Core/Celbridge.WebHost/Web/bootstrap-icons",
]

[component.version_check]
file = "Source/Core/Celbridge.WebHost/Web/bootstrap-icons/bootstrap-icons.css"
